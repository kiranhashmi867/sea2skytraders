<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex">
<title>ページを読み込めません | Sea2Sky Traders</title>
<meta name="theme-color" content="#13358c">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  font-size:16px;line-height:1.65;color:#dce3ef;
  background:
    radial-gradient(700px 380px at 90% 0%,rgba(246,215,122,.2),transparent 62%),
    radial-gradient(520px 340px at 0% 100%,rgba(217,87,124,.14),transparent 62%),
    linear-gradient(135deg,#0b2163 0%,#13358c 60%,#183f9e 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  padding:32px 22px;
  -webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:440px;text-align:center}
.logo{width:120px;height:84px;margin:0 auto 26px;display:block}
h1{
  font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-weight:600;font-size:2.2rem;line-height:1.15;color:#fff;margin-bottom:12px;
}
p{color:#d3dcec;margin-bottom:26px}
button{
  display:inline-flex;align-items:center;justify-content:center;
  padding:15px 34px;border:0;border-radius:999px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:1rem;line-height:1;
  color:#0b2163;background:linear-gradient(135deg,#f6d77a,#e0a526);
  box-shadow:0 14px 30px -12px rgba(224,165,38,.75);
}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.help{
  margin:34px 0 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);
  font-size:.92rem;color:#aab8cf;
}
.help strong{color:#f6d77a;font-weight:600;white-space:nowrap}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style id="i18n-lang">
:root{--sans:'Figtree','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',Georgia,serif}
html[lang=ja] body{line-break:strict;overflow-wrap:anywhere}
html[lang=ja] h1,html[lang=ja] h2,html[lang=ja] h3{letter-spacing:.02em!important;line-height:1.4}
html[lang=ja] *{text-transform:none!important;letter-spacing:.02em!important}
</style>
<style id="i18n-css">
.lang{position:relative;display:inline-flex}
.lang-btn{display:inline-flex;align-items:center;gap:7px;background:transparent;color:#fff;border:1px solid rgba(227,201,143,.45);border-radius:2px;padding:3px 9px;font:inherit;font-size:.78rem;cursor:pointer;letter-spacing:0}
.lang-btn i{margin:0!important;color:var(--gold-light)}
.lang-caret{font-size:.62rem;transition:transform .2s}
.lang.open .lang-caret{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:180px;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid rgba(184,144,74,.35);border-radius:10px;box-shadow:0 22px 44px -18px rgba(10,24,48,.45);z-index:10001;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s}
.lang.open .lang-menu{opacity:1;visibility:visible;transform:none}
.lang-menu a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:7px;color:#0f2240;font-size:.9rem;letter-spacing:0;text-transform:none}
.lang-menu a:hover{background:#f3eee4}
.lang-menu a i{opacity:0;color:#b8904a;margin:0!important}
.lang-menu a[aria-current] {font-weight:700}
.lang-menu a[aria-current] i{opacity:1}
.lang-menu a[lang=ja]{font-family:'Noto Sans JP',var(--sans)}
.lang-menu a[lang=ar]{font-family:'Tajawal',var(--sans)}
@media (max-width:640px){
  .topbar .container{flex-wrap:wrap;justify-content:center;gap:4px 14px;padding-top:6px;padding-bottom:6px}
  .topbar .tb-msg{flex:1 1 100%;width:100%;text-align:center;font-size:.74rem;line-height:1.5}
}
</style>
</head>
<body>

<main>
  <svg class="logo" viewBox="0 0 80 56" aria-hidden="true">
    <path d="M8 46 A32 32 0 0 1 72 46" fill="none" stroke="#e3c98f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14 52 L35 16 L56 52 Z" fill="#f5efe1"/>
    <path d="M37 52 L52 28 L68 52 Z" fill="#b8904a"/>
    <path d="M10 52 H70" stroke="#c9a564" stroke-width="1.6" stroke-linecap="round"/>
  </svg>

  <h1>ページを読み込めません</h1>
  <p>インターネット接続を確認して、もう一度お試しください。オンラインに戻ると自動的に再読み込みされます。</p>

  <button type="button" id="retry">再試行</button>

  <p class="help">ご注文でお困りですか?WhatsAppで Sea2Sky Traders にご連絡ください: <strong>+92 300 8697543</strong></p>
</main>

<script>
// The app shows this page for any address it cannot load, including the Arabic and Japanese pages.
(function () {
  var m = window.location.pathname.match(/^\/(ar|ja)\//);
  if (!m || document.documentElement.lang !== "en") { return; }
  var T = {
    ar: ["تعذّر تحميل هذه الصفحة", "تحقق من اتصالك بالإنترنت وحاول مرة أخرى. ستُعاد تحميل هذه الصفحة تلقائياً عند عودة الاتصال.", "حاول مرة أخرى", "تحتاج مساعدة في طلب؟ راسل Sea2Sky Traders عبر واتساب: "],
    ja: ["ページを読み込めません", "インターネット接続を確認して、もう一度お試しください。オンラインに戻ると自動的に再読み込みされます。", "再試行", "ご注文でお困りですか?WhatsAppで Sea2Sky Traders にご連絡ください:"]
  }[m[1]];
  document.documentElement.lang = m[1];
  if (m[1] === "ar") { document.documentElement.dir = "rtl"; }
  document.querySelector("h1").textContent = T[0];
  document.querySelector("main > p:not(.help)").textContent = T[1];
  document.getElementById("retry").textContent = T[2];
  var help = document.querySelector(".help");
  help.firstChild.textContent = T[3];
})();
document.getElementById("retry").addEventListener("click", function () {
  window.location.reload();
});
window.addEventListener("online", function () {
  window.location.reload();
});
</script>

</body>
</html>
